<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymBuddy">
<meta name="theme-color" content="#0e1013">
<!-- Shared by link only: keep this out of search results. See robots.txt. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your adaptive weekly training program, rebuilt around the days you can train.">
<title data-i18n="program.metaTitle">Your Program — GymBuddy 2.0</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="main">
<section style="padding-top:40px;">
  <div class="wrap" id="root">
    <div class="section-head">
      <div class="kicker" data-i18n="program.kicker">Adaptive program</div>
      <h2 data-i18n="program.title">This week</h2>
      <p id="pIntro"></p>
    </div>
    <div id="phaseBanner"></div>
    <div id="phaseStrip" class="phase-strip"></div>

    <h3 style="margin:34px 0 6px;" data-i18n="program.daysQuestion">Which days can you train?</h3>
<p class="hint" style="margin-bottom:14px;" data-i18n="program.daysHint"></p>
    <div class="day-picker" id="dayPicker"></div>
    <div class="picker-summary" id="pickerSummary"></div>

    <div id="splitNote"></div>
    <div id="warnings"></div>

    <h3 style="margin:34px 0 16px;" data-i18n="program.yourWeek">Your week</h3>
    <div class="session-grid" id="sessionGrid"></div>

    <h3 style="margin:40px 0 6px;" data-i18n="program.weeklyVolume">Weekly volume</h3>
<p class="hint" style="margin-bottom:16px;" data-i18n="program.volumeHint"></p>
    <div class="card" id="volumeCard"></div>

    <h3 style="margin:40px 0 14px;" data-i18n="program.guidelines">Guidelines from your plan</h3>
    <div class="guideline-grid" id="guidelines"></div>
  </div>
</section>
</main>

<script src="js/i18n.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/content.ar.js"></script>
<script src="js/data/library.js"></script>
<script src="js/data/coaching.js"></script>
<script src="js/data/labels.js"></script>
<script src="js/templates.js"></script>
<script src="js/engine/periodization.js"></script>
<script src="js/engine/progression.js"></script>
<script src="js/engine/scheduler.js"></script>
<script src="js/engine/analysis.js"></script>
<script src="js/engine/adaptation.js"></script>
<script src="js/engine/coach.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/program.js"></script>
</body>
</html>
