<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymBuddy">
<meta name="theme-color" content="#0e1013">
<!-- Shared by link only: keep this out of search results. See robots.txt. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Strength trends, training volume, bodyweight and attendance analytics.">
<title data-i18n="progress.metaTitle">Progress — GymBuddy 2.0</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="main">
<section style="padding-top:40px;">
  <div class="wrap" id="root">
    <div class="section-head">
      <div class="kicker" data-i18n="progress.kicker">Analytics</div>
      <h2 data-i18n="progress.title">Progress</h2>
      <p data-i18n="progress.intro"></p>
    </div>
    <div class="kpi-grid" id="kpis"></div>

    <div class="chart-card">
      <h3 data-i18n="progress.e1rmTitle">Estimated 1RM</h3>
      <p class="hint" data-i18n="progress.e1rmHint"></p>
      <div class="filters" id="liftPicker" style="margin-bottom:16px;"></div>
      <canvas class="chart" id="strengthChart" data-height="230"></canvas>
      <div id="strengthMeta" class="hint" style="margin-top:12px;"></div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;" id="dualCharts">
      <div class="chart-card">
        <h3 data-i18n="progress.weightTitle">Bodyweight</h3>
        <p class="hint" id="bwMeta" data-i18n="progress.weightHint"></p>
        <canvas class="chart" id="weightChart" data-height="200"></canvas>
      </div>
      <div class="chart-card">
        <h3 data-i18n="progress.waistTitle">Waist</h3>
        <p class="hint" id="waistMeta" data-i18n="progress.waistHint"></p>
        <canvas class="chart" id="waistChart" data-height="200"></canvas>
      </div>
      <div class="chart-card">
        <h3 data-i18n="progress.tonnageTitle">Weekly training volume</h3>
        <p class="hint" data-i18n="progress.tonnageHint"></p>
        <canvas class="chart" id="tonnageChart" data-height="200"></canvas>
      </div>
    </div>

    <h3 style="margin:36px 0 6px;" data-i18n="progress.attendanceTitle">Attendance</h3>
    <p class="hint" style="margin-bottom:14px;" data-i18n="progress.attendanceHint"></p>
    <div class="card" id="attendance"></div>

    <h3 style="margin:36px 0 14px;" data-i18n="progress.historyTitle">Session history</h3>
    <div class="card" id="history"></div>
  </div>
</section>
</main>

<script src="js/i18n.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/content.ar.js"></script>
<script src="js/i18n/brands.ar.js"></script>
<script src="js/data/library.js"></script>
<script src="js/data/coaching.js"></script>
<script src="js/data/brands.js"></script>
<script src="js/data/brand-photos.js"></script>
<script src="js/data/labels.js"></script>
<script src="js/templates.js"></script>
<script src="js/engine/periodization.js"></script>
<script src="js/engine/progression.js"></script>
<script src="js/engine/scheduler.js"></script>
<script src="js/engine/analysis.js"></script>
<script src="js/engine/adaptation.js"></script>
<script src="js/engine/coach.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/progress.js"></script>
</body>
</html>
