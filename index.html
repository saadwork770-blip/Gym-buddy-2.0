<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Adaptive AI coaching that picks your weights, rebuilds your split around your days, and adapts your workouts.">
<title data-i18n="home.metaTitle">GymBuddy 2.0 — Adaptive AI Coaching for Your Training Plan</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="main">
<header class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" data-i18n="home.eyebrow"></div>
      <h1 data-i18n="home.title"></h1>
      <p class="lead" data-i18n="home.lead"></p>
      <div class="hero-actions" id="heroActions"></div>
      <div class="hero-stats" id="heroStats"></div>
    </div>
    <div class="hero-card" id="heroCard"></div>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="section-head">
      <div class="kicker" data-i18n="home.newTitle"></div>
      <h2 data-i18n="home.newSub"></h2>
    </div>
    <div class="grid grid-4">
      <div class="card feature-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        <h3 data-i18n="home.f1t"></h3>
        <p data-i18n="home.f1b"></p>
      </div>
      <div class="card feature-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
        <h3 data-i18n="home.f2t"></h3>
        <p data-i18n="home.f2b"></p>
      </div>
      <div class="card feature-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M20 9A8 8 0 0 0 6 6L4 8"/><path d="M4 15a8 8 0 0 0 14 3l2-2"/></svg>
        <h3 data-i18n="home.f3t"></h3>
        <p data-i18n="home.f3b"></p>
      </div>
      <div class="card feature-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <h3 data-i18n="home.f4t"></h3>
        <p data-i18n="home.f4b"></p>
      </div>
    </div>
  </div>
</section>

<section style="padding-top:0;">
  <div class="wrap">
    <div class="section-head">
      <div class="kicker" data-i18n="home.howTitle"></div>
      <h2 data-i18n="home.howSub"></h2>
    </div>
    <div class="grid grid-3" id="explainGrid"></div>
  </div>
</section>

<section style="padding-top:0;">
  <div class="wrap">
    <div class="disclaimer"><b data-i18n="home.disclaimerTitle"></b> <span data-i18n-html="home.disclaimer"></span></div>
  </div>
</section>
</main>

<script src="js/i18n.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/content.ar.js"></script>
<script src="js/data.js"></script>
<script src="js/templates.js"></script>
<script src="js/engine/periodization.js"></script>
<script src="js/engine/progression.js"></script>
<script src="js/engine/scheduler.js"></script>
<script src="js/engine/analysis.js"></script>
<script src="js/engine/adaptation.js"></script>
<script src="js/engine/coach.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/index.js"></script>
</body>
</html>
