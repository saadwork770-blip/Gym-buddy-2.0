<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Illustrated exercise library with movement patterns, joint load and substitutions.">
<title data-i18n="library.metaTitle">Exercise Library — GymBuddy 2.0</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="main">
<section style="padding-top:40px;">
  <div class="wrap">
    <div class="section-head">
      <div class="kicker" data-i18n="library.kicker">Exercise Library</div>
      <h2 data-i18n="library.title">Every movement the coach can put in your plan</h2>
<p id="libIntro" data-i18n-html="library.intro"></p>
    </div>

    <div class="filters">
      <input type="text" class="search-input" id="search" data-i18n-placeholder="library.search" data-i18n-aria="library.search">
    </div>
    <div class="filters" id="muscleFilters"></div>
    <div class="filters" id="extraFilters"></div>

    <div class="grid grid-4" id="exGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;" data-i18n="library.empty"></div>
  </div>
</section>
</main>

<script src="js/i18n.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/content.ar.js"></script>
<script src="js/data.js"></script>
<script src="js/templates.js"></script>
<script src="js/engine/periodization.js"></script>
<script src="js/engine/progression.js"></script>
<script src="js/engine/scheduler.js"></script>
<script src="js/engine/adaptation.js"></script>
<script src="js/engine/coach.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/exercises.js"></script>
</body>
</html>
